<!doctype html>
<html lang="{{ page.lang | default: site.lang }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <meta name="color-scheme" content="light dark">
    <title>{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>
    <link rel="canonical" href="{{ page.url | absolute_url }}">
    <link rel="icon" type="image/svg+xml" href="{{ '/favicon.svg' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
    <script>
      (function () {
        try {
          var savedTheme = localStorage.getItem("theme");
          if (savedTheme === "light" || savedTheme === "dark") {
            document.documentElement.dataset.theme = savedTheme;
          }
        } catch (error) {}
      })();
    </script>
    <script src="{{ '/assets/js/theme.js' | relative_url }}" defer></script>
  </head>
  <body id="top"{% if page.url == '/' %} class="home-page"{% endif %}>
    <a class="skip-link" href="#main-content">Pular para o conteúdo</a>
    {% include header.html %}
    <main id="main-content" class="page-shell">
      {{ content }}
    </main>
    {% include footer.html %}
  </body>
</html>
