<header class="site-header">
  <a class="wordmark" href="{{ '/' | relative_url }}" aria-label="{{ site.title | escape }}, início">{{ site.title | escape }}<span aria-hidden="true">.</span></a>
  <nav class="site-nav" aria-label="Navegação principal">
    <a href="{{ '/' | relative_url }}"{% if page.url == '/' %} aria-current="page"{% endif %}>Início</a>
    <a href="{{ '/blog/' | relative_url }}"{% if page.url contains '/blog' %} aria-current="page"{% endif %}>Blog</a>
    <a href="{{ '/contact/' | relative_url }}"{% if page.url == '/contact/' %} aria-current="page"{% endif %}>Contato</a>
  </nav>
  <button class="theme-toggle" type="button" aria-label="Tema escuro" aria-pressed="false" data-theme-toggle>
    <svg class="theme-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path class="moon-icon" d="M20.1 15.2A8.5 8.5 0 0 1 8.8 3.9 8.5 8.5 0 1 0 20.1 15.2Z" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.7"/><g class="sun-icon" fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="1.7"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"/></g></svg>
    <span>Tema</span>
  </button>
</header>
